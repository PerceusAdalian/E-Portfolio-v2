<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perceus Willy</title>
    <script src="https://kit.fontawesome.com/5b7b940d8e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section id="landing-page">
        <nav>
            <div class="nav__container">
                <figure class="logo__figure">
                    <a href="#footer"><img src="./assets/logo.png" class="logo" alt=""></a>
                </figure>
                <ul class="nav__links">
                    <li class="nav__link">
                        <a href="#" class="nav__icon" data-tooltip="Home">
                            <i class="fa-regular fa-house"></i>
                        </a>
                    </li>
                    <li class="nav__link">
                        <a href="#projects" class="nav__icon" data-tooltip="Projects">
                            <i class="fa-solid fa-diagram-project"></i>
                        </a>
                    </li>
                    <li class="nav__link">
                        <a href="#skills" class="nav__icon" data-tooltip="Tech Stack">
                            <i class="fa-solid fa-info"></i>
                        </a>
                    </li>
                    <li class="nav__link">
                        <a href="#contact" class="nav__icon" data-tooltip="Contact">
                            <i class="fa-regular fa-handshake"></i>
                        </a>
                    </li>
                    <li class="nav__link">
                        <button class="mode-toggle">
                            <i class="fa-solid fa-sun icon-sun"></i>
                            <i class="fa-solid fa-moon icon-moon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
        
    </section>
    <script src="app.js"></script>
</body>
</html>
